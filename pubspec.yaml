name: focus_app
description: A premium Focus Timer and Productivity application for professionals and students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  provider: ^6.1.2
    # --- Android Intent (For Onboarding Permissions) ---
  android_intent_plus: ^5.0.2

  # --- Audio ---
  audioplayers: ^6.1.0

  # --- Local Database ---
  sqflite: ^2.3.3+2
  path: ^1.9.0

  # --- Local Storage (Key-Value) ---
  shared_preferences: ^2.3.4

  # --- Connectivity ---
  connectivity_plus: ^6.1.1

  # --- Firebase (Authentication and Firestore for Leaderboard Sync) ---
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1

  # --- YouTube Player for Study Tube ---
  youtube_player_flutter: ^9.1.1

  # --- Animations ---
  lottie: ^3.2.0
  animated_text_kit: ^4.2.2

  # --- UI Utilities ---
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

  # --- Permissions ---
  permission_handler: ^11.3.1

  # --- Notifications ---
  flutter_local_notifications: ^18.0.1

  # --- Background Execution ---
  flutter_background_service: ^5.0.12
  flutter_background_service_android: ^6.2.9

  # --- Device Info (for usage stats channel) ---
  device_info_plus: ^11.2.1

  # --- Intl for date formatting ---
  intl: ^0.19.0

  # --- UUID generation ---
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  fonts:
    - family: PoppinsBold
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: PoppinsMedium
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    - family: PoppinsRegular
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
