name: focusflow
description: A premium Focus Timer & Productivity app for professionals and students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- STATE MANAGEMENT ---
  provider: ^6.1.2

  # --- FIREBASE & AUTH ---
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.1

  # --- UI & DESIGN ---
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  smooth_page_indicator: ^1.2.0+3
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  percent_indicator: ^4.2.3
  glassmorphism: ^3.0.0

  # --- AUDIO ---
  audioplayers: ^6.1.0
  
  # --- LOCAL STORAGE ---
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # --- NOTIFICATIONS ---
  flutter_local_notifications: ^18.0.1

  # --- CONNECTIVITY ---
  connectivity_plus: ^6.1.1

  # --- DEVICE APPS / USAGE ---
  device_apps: ^2.2.0
  installed_apps: ^1.5.0
  usage_stats: ^1.2.0

  # --- YOUTUBE ---
  youtube_player_flutter: ^9.1.1

  # --- UTILITIES ---
  intl: ^0.19.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  vibration: ^2.0.0
  wakelock_plus: ^1.2.8
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter_native_splash: ^2.4.4

  # --- ICONS ---
  cupertino_icons: ^1.0.8
  flutter_feather_icons: ^2.0.0+1
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/

  # Native splash screen config
flutter_native_splash:
  color: "#000000"
  image: assets/images/logo.png
  android: true
  ios: false
